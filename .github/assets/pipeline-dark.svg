<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 184" width="784" height="184" fill="none" role="img" aria-label="Eventum pipeline. Input decides when events occur: schedules, traffic patterns, explicit timestamps, on-demand triggers. Event decides what they look like: templates, scripts, replayed recordings. Output decides where they go: console, files, network endpoints, datastores.">
  <title>Input to Event to Output pipeline</title>
  <defs>
    <linearGradient id="card-input" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8f8ef6" stop-opacity="0.15"/><stop offset="100%" stop-color="#8f8ef6" stop-opacity="0.05"/></linearGradient>
    <linearGradient id="slot-input" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8f8ef6" stop-opacity="0.2"/><stop offset="100%" stop-color="#8f8ef6" stop-opacity="0.09"/></linearGradient>
    <linearGradient id="card-event" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6fbde3" stop-opacity="0.15"/><stop offset="100%" stop-color="#6fbde3" stop-opacity="0.05"/></linearGradient>
    <linearGradient id="slot-event" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6fbde3" stop-opacity="0.2"/><stop offset="100%" stop-color="#6fbde3" stop-opacity="0.09"/></linearGradient>
    <linearGradient id="card-output" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4fd7b2" stop-opacity="0.15"/><stop offset="100%" stop-color="#4fd7b2" stop-opacity="0.05"/></linearGradient>
    <linearGradient id="slot-output" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4fd7b2" stop-opacity="0.2"/><stop offset="100%" stop-color="#4fd7b2" stop-opacity="0.09"/></linearGradient>
    <linearGradient id="flow-0" x1="208" y1="0" x2="292" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#8f8ef6"/><stop offset="100%" stop-color="#6fbde3"/></linearGradient>
    <linearGradient id="flow-1" x1="492" y1="0" x2="576" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#6fbde3"/><stop offset="100%" stop-color="#4fd7b2"/></linearGradient>
  </defs>

