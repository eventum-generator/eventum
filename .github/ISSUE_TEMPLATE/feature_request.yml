name: Feature request
description: Suggest a capability or an improvement
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas, consider starting a [Discussion](https://github.com/orgs/eventum-generator/discussions) first.
  - type: textarea
    id: problem
    attributes:
      label: What is missing or gets in the way
      description: The use case behind the request, and what you do about it today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What should happen instead
      description: The behaviour you would like. A config snippet or a sketch of the output helps.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Eventum Studio
        - Core - generation engine
        - Plugins - input, event, output
        - API, MCP or CLI
        - Documentation
        - Not sure
    validations:
      required: true
