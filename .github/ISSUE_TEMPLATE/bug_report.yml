name: Bug report
description: Report a problem with Eventum
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        For usage questions, use [Discussions](https://github.com/orgs/eventum-generator/discussions) instead. Do not report security issues here - see the [security policy](https://github.com/eventum-generator/eventum/security/policy).
  - type: textarea
    id: what
    attributes:
      label: What happens, and how to reproduce it
      description: What you expected, what happened instead, and the shortest way to trigger it.
      placeholder: |
        Events stop after the first batch when two generators run at once.

        1. Start the app with the config below.
        2. Start both generators.
        3. The second one writes nothing after ~10 seconds.
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      options:
        - 2.8.x
        - 2.7.x
        - 2.6.x
        - 2.5.x or older
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Eventum Studio
        - Core - generation engine
        - Plugins - input, event, output
        - API, MCP or CLI
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Config, template or logs
      description: Whatever reproduces the problem or shows the failure. Rendered as code, so no backticks needed.
      render: shell
    validations:
      required: false
