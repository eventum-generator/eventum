name: CI

on:
  push:
    branches: [master, develop]
    paths-ignore:
      - "LICENSE"
      - "**.md"
      - "config/**"
  pull_request:
    branches: [master, develop]
    paths-ignore:
      - "LICENSE"
      - "**.md"
      - "config/**"

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          freethreaded: true
      - name: Install dependencies
        run: uv sync --group dev
      - name: Check linting
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          freethreaded: true
      - name: Install dependencies
        run: uv sync --group dev
      - name: Check types
        run: uv run mypy eventum/

  ui:
    name: Studio UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: eventum/ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: eventum/ui/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: eventum/ui
        run: pnpm install --frozen-lockfile
      - name: Check linting
        working-directory: eventum/ui
        run: pnpm lint
      - name: Run tests
        working-directory: eventum/ui
        run: pnpm test
      - name: Build
        working-directory: eventum/ui
        run: pnpm build
      - name: Verify build output
        run: test -f eventum/www/index.html || { echo "::error::UI build failed - index.html not found"; exit 1; }

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          freethreaded: true
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest -m "not integration and not performance" --cov=eventum --cov-branch --cov-report=xml --cov-report=html
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
